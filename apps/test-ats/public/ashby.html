<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="copilot-ats" content="ashby" />
    <meta name="copilot-company" content="Example Systems" />
    <meta name="copilot-requisition-id" content="26a4281b-4ab2-4829-b664-7c43d7dbd409" />
    <meta name="description" content="Build resilient infrastructure for distributed teams." />
    <title>Infrastructure Engineer — Example Systems</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@type": "JobPosting",
        "title": "Infrastructure Engineer",
        "description": "Build resilient infrastructure for distributed teams.",
        "identifier": { "value": "26a4281b-4ab2-4829-b664-7c43d7dbd409" },
        "hiringOrganization": { "name": "Example Systems" },
        "jobLocation": {
          "address": { "addressLocality": "Remote", "addressRegion": "India" }
        },
        "employmentType": "FullTime"
      }
    </script>
  </head>
  <body data-ats="ashby">
    <header data-ashby-job-posting>
      <span class="company" data-company-name>Example Systems · Ashby fixture</span>
      <h1 data-testid="job-title">Infrastructure Engineer</h1>
      <p data-testid="job-location">Remote · India</p>
      <span data-testid="job-workplace-type">Remote</span>
    </header>
    <main>
      <section>
        <p class="eyebrow">Controlled Test ATS</p>
        <h2>Apply for this role</h2>
        <p data-testid="job-description">Build resilient infrastructure for distributed teams.</p>
        <form data-testid="application-form" novalidate>
          <div class="field">
            <label for="ashby-name">Full name</label>
            <input id="ashby-name" name="_systemfield_name" required />
          </div>
          <div class="field">
            <label for="ashby-email">Email</label>
            <input id="ashby-email" name="_systemfield_email" type="email" required />
          </div>
          <div class="field">
            <label for="ashby-phone">Phone</label>
            <input id="ashby-phone" name="_systemfield_phone" type="tel" />
          </div>
          <div class="field">
            <label for="ashby-linkedin">LinkedIn URL</label>
            <input id="ashby-linkedin" name="_systemfield_linkedin_url" type="url" />
          </div>
          <div class="field">
            <label for="ashby-company">Current company</label>
            <input id="ashby-company" name="_systemfield_company" />
          </div>
          <div class="field">
            <label for="ashby-title">Current job title</label>
            <input id="ashby-title" name="_systemfield_job_title" />
          </div>
          <div class="field">
            <label for="ashby-resume">Résumé</label>
            <input
              id="ashby-resume"
              name="_systemfield_resume"
              type="file"
              accept=".pdf,.docx"
              required
            />
            <output id="ashby-resume-output" aria-live="polite">No résumé selected</output>
          </div>
          <div class="field">
            <span id="ashby-office-label">Preferred office</span>
            <input
              id="ashby-office"
              role="combobox"
              aria-labelledby="ashby-office-label"
              aria-controls="ashby-office-options"
              aria-required="true"
            />
            <div id="ashby-office-options" role="listbox" aria-label="Available offices">
              <div role="option" data-value="blr">Bengaluru</div>
              <div role="option" data-value="remote">Remote</div>
            </div>
          </div>
          <div class="field">
            <label for="ashby-workplace">Preferred workplace type</label>
            <select
              id="ashby-workplace"
              name="custom_workplace_preference"
              data-reveal-target="ashby-workplace-detail"
            >
              <option value="">Choose one</option>
              <option value="remote">Remote</option>
              <option value="hybrid">Hybrid</option>
            </select>
          </div>
          <div class="field" id="ashby-workplace-detail" hidden>
            <label for="ashby-workplace-reason">Why is this arrangement important to you?</label>
            <textarea id="ashby-workplace-reason" name="custom_workplace_reason"></textarea>
          </div>
          <div class="field">
            <label for="ashby-interest">Why do you want to join Example Systems?</label>
            <textarea id="ashby-interest" name="custom_why_company" rows="4"></textarea>
          </div>
          <button type="button" disabled>Submit disabled in Test ATS</button>
        </form>
      </section>
    </main>
    <script src="ats-fixtures.js"></script>
  </body>
</html>
